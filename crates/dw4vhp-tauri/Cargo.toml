[package]
name = "dw4vhp-tauri"
version = "0.9.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Desktop shell for the Digimon World 4 Crown Mod ISO patcher"

[[bin]]
name = "dw4-crown-mod"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
agent-control = []

[dependencies]
dw4vhp-core = { path = "../dw4vhp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# xdg-portal makes Linux use the desktop's own file picker (KDE, GNOME) instead of GTK's.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
