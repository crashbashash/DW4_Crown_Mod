[package]
name = "dw4vhp-tauri"
version = "0.11.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Desktop shell for the Digimon World 4 Crown Mod ISO patcher"

[[bin]]
name = "dw4-crown-mod"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
agent-control = []

[dependencies]
dw4vhp-core = { path = "../dw4vhp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# xdg-portal makes Linux use the desktop's own file picker (KDE, GNOME) instead of GTK's.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
semver = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ApplicationInstallationAndServicing", "Win32_System_SystemInformation"] }

# Keep bulk disc work fast while debugging, including generic hashing code.
# Debug symbols, debug assertions and overflow checks remain enabled.
[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.crypto-common]
opt-level = 3

[profile.dev.package.dw4vhp-core]
opt-level = 2
