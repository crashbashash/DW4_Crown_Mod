name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/release-windows.yml
  linux:
    uses: ./.github/workflows/release-linux.yml
  publish:
    name: Publish complete release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
      - name: Prepare changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/release-notes.mjs --tag "$RELEASE_TAG" --output release-notes.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-assets'
          merge-multiple: true
          path: release-assets
      - name: Verify complete download set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for file in \
            "dw4-crown-mod-${RELEASE_TAG}-windows-x86_64.zip" \
            "dw4-crown-mod-${version}-windows-x86_64.msi" \
            "dw4-crown-mod-${RELEASE_TAG}-linux-x86_64.AppImage" \
            "dw4-crown-mod-${RELEASE_TAG}-linux-x86_64.deb" \
            "dw4-crown-mod-${RELEASE_TAG}-linux-x86_64.tar.gz"; do
            test -s "release-assets/$file"
          done
      - name: Upload complete release as draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: DW4 Crown Mod ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish after every asset is uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
