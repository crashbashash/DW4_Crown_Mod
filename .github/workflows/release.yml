name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux (AppImage, deb, tarball)
            os: ubuntu-22.04
          - label: Windows (zip)
            os: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libgtk-3-dev
      - name: Build release binary
        run: cargo build --release -p dw4vhp-gui
      - name: Smoke-check --version (Linux)
        if: runner.os == 'Linux'
        run: ./target/release/dw4-veryhard-plus --version
      - name: Smoke-check --version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\release\dw4-veryhard-plus.exe --version

      - name: Package Linux (AppImage, deb, tarball)
        if: runner.os == 'Linux'
        env:
          ASSET_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DEB_VERSION="${ASSET_VERSION#v}"
          BIN="target/release/dw4-veryhard-plus"
          PREFIX="dw4-veryhard-plus-${ASSET_VERSION}-linux-x86_64"
          STAGE="$(mktemp -d)"

          # Plain binary tarball (the binary only, no installer).
          tar -czf "${PREFIX}.tar.gz" -C target/release dw4-veryhard-plus

          # --- AppImage ---
          APPDIR="${STAGE}/AppDir"
          mkdir -p \
            "${APPDIR}/usr/bin" \
            "${APPDIR}/usr/share/applications" \
            "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
          install -m 755 "${BIN}" "${APPDIR}/usr/bin/dw4-veryhard-plus"
          ln -s usr/bin/dw4-veryhard-plus "${APPDIR}/AppRun"
          cp crates/dw4vhp-gui/icons/icon.png \
            "${APPDIR}/usr/share/icons/hicolor/256x256/apps/dw4-veryhard-plus.png"
          cp crates/dw4vhp-gui/icons/icon.png "${APPDIR}/dw4-veryhard-plus.png"
          cat > "${APPDIR}/dw4-veryhard-plus.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DW4 Very Hard Plus
          Comment=Patch a Digimon World 4 (USA) ISO to Very Hard Plus
          Exec=dw4-veryhard-plus
          Icon=dw4-veryhard-plus
          Categories=Utility;
          Terminal=false
          EOF
          cp "${APPDIR}/dw4-veryhard-plus.desktop" \
            "${APPDIR}/usr/share/applications/dw4-veryhard-plus.desktop"

          curl -fL -o "${STAGE}/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "${STAGE}/appimagetool"
          # APPIMAGE_EXTRACT_AND_RUN avoids the CI/libfuse2 dependency.
          APPIMAGE_EXTRACT_AND_RUN=1 "${STAGE}/appimagetool" \
            "${APPDIR}" "${PREFIX}.AppImage"

          # --- deb ---
          PKGROOT="${STAGE}/pkg"
          mkdir -p \
            "${PKGROOT}/DEBIAN" \
            "${PKGROOT}/usr/bin" \
            "${PKGROOT}/usr/share/applications" \
            "${PKGROOT}/usr/share/icons/hicolor/256x256/apps"
          install -m 755 "${BIN}" "${PKGROOT}/usr/bin/dw4-veryhard-plus"
          cp "${APPDIR}/dw4-veryhard-plus.desktop" \
            "${PKGROOT}/usr/share/applications/dw4-veryhard-plus.desktop"
          cp crates/dw4vhp-gui/icons/icon.png \
            "${PKGROOT}/usr/share/icons/hicolor/256x256/apps/dw4-veryhard-plus.png"
          cat > "${PKGROOT}/DEBIAN/control" <<EOF
          Package: dw4-veryhard-plus
          Version: ${DEB_VERSION}
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: crashbashash <109347317+crashbashash@users.noreply.github.com>
          Description: Patch a Digimon World 4 (USA) ISO to Very Hard Plus
           A desktop app that turns a player's own clean Digimon World 4
           (USA, SLUS_208.36) disc into a much harder one.
          EOF
          dpkg-deb --build --root-owner-group "${PKGROOT}" "${PREFIX}.deb"

          ls -l "${PREFIX}.tar.gz" "${PREFIX}.AppImage" "${PREFIX}.deb"

      - name: Package Windows (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zip = "dw4-veryhard-plus-$version-windows-x86_64.zip"
          Compress-Archive -Path target\release\dw4-veryhard-plus.exe -DestinationPath $zip
          Get-Item $zip | Select-Object -ExpandProperty FullName

      - name: Upload Linux assets
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-assets
          path: |
            dw4-veryhard-plus-*.tar.gz
            dw4-veryhard-plus-*.AppImage
            dw4-veryhard-plus-*.deb
          if-no-files-found: error

      - name: Upload Windows assets
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-assets
          path: dw4-veryhard-plus-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: assets
      - name: List assets
        run: ls -l assets
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: DW4 Very Hard Plus ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: assets/dw4-veryhard-plus-*
          body: |
            DW4 Very Hard Plus ${{ github.ref_name }}.

            Unsigned release assets:

            - Windows: `dw4-veryhard-plus-${{ github.ref_name }}-windows-x86_64.zip`
              contains the release `.exe`. It is built in CI, but launching it is
              unverified in this environment — it has not been run here.
            - Linux: `.AppImage`, `.deb`, and a plain binary tarball.

            No game data is bundled: every byte the app writes is derived from your
            own clean Digimon World 4 (USA, `SLUS_208.36`) disc at runtime.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
