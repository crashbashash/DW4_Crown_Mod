name: Release Windows

on:
  push:
    tags: ['v*']

permissions:
  # Creating the release and uploading the built assets needs write access.
  contents: write

jobs:
  build:
    name: Build Windows (zip, MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain @ stable
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: actions/setup-node@v4
      - name: Build the frontend and the Tauri app (MSI via the bundler)
        run: |
          npm ci
          npx tauri build --bundles msi
        # The Tauri CLI resolves its own target dir next to the excluded
        # crate: crates\dw4vhp-tauri\target. The packaging steps read from
        # there (verified locally: the CLI ignores CARGO_TARGET_DIR).
      - name: Package Windows (zip)
        shell: pwsh
        env:
          ASSET_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:ASSET_VERSION
          $zip = "dw4-veryhard-plus-$version-windows-x86_64.zip"
          Compress-Archive -Path crates\dw4vhp-tauri\target\release\dw4-veryhard-plus.exe `
            -DestinationPath $zip
          Get-Item $zip | Select-Object -ExpandProperty FullName

      - name: Package Windows (MSI name)
        shell: pwsh
        env:
          ASSET_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:ASSET_VERSION.TrimStart("v")
          # The bundler's MSI (WiX, UpgradeCode pinned in tauri.conf.json)
          # lands in the crate's own target dir, under a bundler-chosen name;
          # copy whichever MSI it produced under the asset name.
          $msi = Get-ChildItem "crates\dw4vhp-tauri\target\release\bundle\msi" -Filter *.msi |
            Select-Object -First 1
          Copy-Item $msi.FullName `
            -Destination "dw4-veryhard-plus-$version-windows-x86_64.msi"
          Get-Item *.msi | Select-Object -ExpandProperty FullName

      - name: Upload Windows assets
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-assets
          path: |
            dw4-veryhard-plus-*.zip
            dw4-veryhard-plus-*.msi
          if-no-files-found: error

      - name: Publish Windows assets to release
        # v2: softprops/action-gh-release
        uses:
          softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: DW4 Very Hard Plus ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          append_body: true
          body: |
            Windows: `dw4-veryhard-plus-${{ github.ref_name
              }}-windows-x86_64.zip` has the release `.exe`;
              `…-x86_64.msi` is the same build as an installer (into
              Program Files, with a Start-menu shortcut). Both are built
              in CI, but launching either is unverified here — not run in
              this environment.
          files: |
            dw4-veryhard-plus-*-windows-x86_64.zip
            dw4-veryhard-plus-*-windows-x86_64.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
