[workspace]
resolver = "2"
members = ["crates/dw4vhp-core"]
# webkit2gtk-4.1 is not available in every build environment, and a member that
# cannot compile would break the whole workspace gate. CI (or a developer host)
# builds this crate in a job that installs the system dependencies.
exclude = ["crates/dw4vhp-tauri"]

# Keep bulk disc work fast while debugging, including generic hashing code.
# Debug symbols, debug assertions and overflow checks remain enabled.
[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.crypto-common]
opt-level = 3

[profile.dev.package.dw4vhp-core]
opt-level = 2
